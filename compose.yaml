services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hoanglong
      POSTGRES_PASSWORD: hoanglong_local
      POSTGRES_DB: phu_tung_hoang_long
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoanglong -d phu_tung_hoang_long"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
